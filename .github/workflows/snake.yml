name: Generate Snake

# Generates an animated SVG of a snake eating the contribution graph.
# Output is committed to the `output` branch, which the README references.

on:
  schedule:
    # Every 12 hours. GitHub trims idle cron schedules, so keep some activity.
    - cron: "0 */12 * * *"
  # Run manually from the Actions tab whenever you want a fresh snake.
  workflow_dispatch:
  # Regenerate whenever you push to main (e.g. after editing the README).
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
